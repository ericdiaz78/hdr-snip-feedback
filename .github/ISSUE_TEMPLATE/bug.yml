name: Bug report
description: Something in HDR Snip did not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: This tracker is public. Do not include private information or screenshots that show it.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Describe what happened, then paste the report HDR Snip copied for you (Settings > Report a bug).
      value: |
        ### What happened
        (Replace this line: what you did, what you expected, and what you saw.)

        ### Diagnostics
        (In HDR Snip, use Settings > Report a bug. Then select this line and press Ctrl+V to paste the copied report.)
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display setup
      options:
        - One HDR display
        - One SDR display
        - HDR and SDR displays together
        - Several HDR displays
        - Not sure
    validations:
      required: true
